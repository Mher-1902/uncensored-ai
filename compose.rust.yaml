# Explicit candidate only: never selected by the existing deployment command.
# Requires checksum-verified .data/tokenizer artifacts and completed validation.
services:
  model:
    stop_grace_period: 20s
    image: offscript-model-rust:${RELEASE_TAG:-candidate}
    build:
      context: .
      dockerfile: docker/model-rust.Dockerfile
    healthcheck:
      test: [CMD, /usr/local/bin/offscript-backend, check-model]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
  gateway:
    stop_grace_period: 35s
    image: offscript-gateway-rust:${RELEASE_TAG:-candidate}
    build:
      context: .
      dockerfile: docker/gateway-rust.Dockerfile
    volumes:
      - type: bind
        source: ./.data/tokenizer
        target: /app/.data/tokenizer
        read_only: true
        bind:
          create_host_path: false
