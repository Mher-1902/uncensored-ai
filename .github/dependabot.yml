version: 2
multi-ecosystem-groups:
  maintenance:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: maintenance
  - package-ecosystem: npm
    directory: /cloud/vercel-api
    patterns: ["*"]
    multi-ecosystem-group: maintenance
  - package-ecosystem: npm
    directory: /cloud/vercel-gateway
    patterns: ["*"]
    multi-ecosystem-group: maintenance
  - package-ecosystem: docker
    directory: /docker
    patterns: ["*"]
    multi-ecosystem-group: maintenance
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: maintenance
