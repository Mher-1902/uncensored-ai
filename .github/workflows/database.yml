name: Database isolation
on:
  pull_request:
    paths: ['supabase/**', 'scripts/test_database.py', '.github/workflows/database.yml']
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/test_database.py', '.github/workflows/database.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    name: RLS and atomic admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: offscript_test
          POSTGRES_PASSWORD: disposable-test-only
        options: >-
          --label offscript.testing=1
          --cpus=1 --memory=512m --memory-swap=512m --pids-limit=64
          --health-cmd="pg_isready -U postgres -d offscript_test"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test_database.py --container '${{ job.services.postgres.id }}'
