[package]
name = "offscript-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["json"] }
bytes = "=1.10.1"
futures-util = "=0.3.31"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["service", "tokio"] }
nix = { version = "=0.30.1", features = ["signal", "process"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
tokio-stream = "=0.1.17"
tokio-util = { version = "=0.7.16", features = ["rt"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }
